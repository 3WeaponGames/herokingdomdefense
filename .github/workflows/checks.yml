name: Game checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      COCOS_SPINE_ROOT: ${{ runner.temp }}/cocos-spine-2.4.13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Creator Spine test dependencies
        run: node tools/testing/prepare-creator-spine.cjs "$COCOS_SPINE_ROOT"
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-audits
          path: ${{ runner.temp }}/HeroKingdomDefense/audit/
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        websockets: ['12.0', '17.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "websockets==${{ matrix.websockets }}"
      - run: python -m unittest discover -s packages/cocos-mcp-2x/server/tests -p 'test_*.py' -v
