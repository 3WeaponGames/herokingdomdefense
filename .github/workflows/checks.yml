name: Game checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Creator Spine test dependencies
        run: |
          node tools/testing/prepare-creator-spine.cjs "$RUNNER_TEMP/cocos-spine-2.4.13"
          echo "COCOS_SPINE_ROOT=$RUNNER_TEMP/cocos-spine-2.4.13" >> "$GITHUB_ENV"
      - name: Run game checks
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/game-checks.log"
      - name: Report game check failures
        if: failure()
        run: |
          node - "$RUNNER_TEMP/game-checks.log" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          if (!fs.existsSync(file)) process.exit(0);
          const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
          const failures = [];
          for (let i = 0; i < lines.length; i++) {
            if (/^(?:not ok\b|✖(?! failing tests)|(?:Assertion)?Error:)/.test(lines[i])) {
              failures.push(lines.slice(i, i + 45).join('\n'));
              if (failures.length === 10) break;
            }
          }
          if (!failures.length) failures.push(lines.slice(-60).join('\n'));
          for (const failure of failures) {
            const escaped = failure.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            console.log('::error title=Game checks::' + escaped);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-audits
          path: ${{ runner.temp }}/HeroKingdomDefense/audit/
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        websockets: ['12.0', '17.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "websockets==${{ matrix.websockets }}"
      - run: python -m unittest discover -s packages/cocos-mcp-2x/server/tests -p 'test_*.py' -v
